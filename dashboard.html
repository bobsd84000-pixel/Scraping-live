<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f9fafb;
      --border: #e5e7eb;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --accent: #3b82f6;
      --success: #10b981;
      --warn: #f59e0b;
      --error: #ef4444;
    }
    [data-theme="dark"] {
      --bg: #111827;
      --surface: #1f2937;
      --border: #374151;
      --text-primary: #f3f4f6;
      --text-secondary: #d1d5db;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    body { background: var(--bg); color: var(--text-primary); padding: 20px; transition: 0.2s; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    h1 { font-size: 28px; font-weight: 600; }
    .controls { display: flex; gap: 12px; }
    .btn {
      padding: 8px 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: var(--surface); color: var(--text-primary); border: 1px solid var(--border); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; margin-bottom: 20px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }
    .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
    canvas { max-height: 300px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-value { font-size: 24px; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📊 Real-Time Dashboard</h1>
    <div class="controls">
      <button class="btn btn-secondary" id="themToggle">🌙 Dark Mode</button>
      <button class="btn" id="exportBtn">📥 Export CSV</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-box">
      <div class="stat-value" id="totalEvents">0</div>
      <div class="stat-label">Total Events</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" id="avgValue">0</div>
      <div class="stat-label">Avg Value</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" id="maxValue">0</div>
      <div class="stat-label">Max Value</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" id="uptime">0%</div>
      <div class="stat-label">Uptime</div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>📈 Time Series</h2>
      <canvas id="lineChart"></canvas>
    </div>
    <div class="card">
      <h2>📊 Distribution</h2>
      <canvas id="barChart"></canvas>
    </div>
    <div class="card">
      <h2>🎯 Categories</h2>
      <canvas id="pieChart"></canvas>
    </div>
  </div>

  <script>
    const isDark = () => localStorage.getItem('theme') === 'dark';
    const setTheme = (dark) => {
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      document.getElementById('themToggle').textContent = dark ? '☀️ Light Mode' : '🌙 Dark Mode';
    };

    document.getElementById('themToggle').addEventListener('click', () => setTheme(!isDark()));
    setTheme(isDark() || window.matchMedia('(prefers-color-scheme: dark)').matches);

    let lineCtx, barCtx, pieCtx;
    let data = { timestamps: [], values: [], categories: {}, events: 0 };

    function initCharts() {
      lineCtx = new Chart(document.getElementById('lineChart'), {
        type: 'line',
        data: { labels: [], datasets: [{ label: 'Value', data: [], borderColor: '#3b82f6', tension: 0.3 }] },
        options: { responsive: true, plugins: { legend: { display: true } } }
      });
      barCtx = new Chart(document.getElementById('barChart'), {
        type: 'bar',
        data: { labels: ['A', 'B', 'C', 'D'], datasets: [{ label: 'Count', data: [0, 0, 0, 0], backgroundColor: '#10b981' }] },
        options: { responsive: true }
      });
      pieCtx = new Chart(document.getElementById('pieChart'), {
        type: 'doughnut',
        data: { labels: [], datasets: [{ data: [], backgroundColor: ['#3b82f6', '#ef4444', '#f59e0b', '#10b981'] }] },
        options: { responsive: true }
      });
    }

    function updateData(val, cat) {
      data.timestamps.push(new Date().toLocaleTimeString());
      data.values.push(val);
      data.events++;
      data.categories[cat] = (data.categories[cat] || 0) + 1;
      if (data.timestamps.length > 20) {
        data.timestamps.shift();
        data.values.shift();
      }
      updateCharts();
      updateStats();
    }

    function updateCharts() {
      lineCtx.data.labels = data.timestamps;
      lineCtx.data.datasets[0].data = data.values;
      lineCtx.update();

      const cats = Object.keys(data.categories);
      barCtx.data.labels = cats;
      barCtx.data.datasets[0].data = cats.map(c => data.categories[c]);
      barCtx.update();

      pieCtx.data.labels = cats;
      pieCtx.data.datasets[0].data = cats.map(c => data.categories[c]);
      pieCtx.update();
    }

    function updateStats() {
      document.getElementById('totalEvents').textContent = data.events;
      document.getElementById('avgValue').textContent = data.values.length ? (data.values.reduce((a, b) => a + b) / data.values.length).toFixed(1) : '0';
      document.getElementById('maxValue').textContent = data.values.length ? Math.max(...data.values) : '0';
      document.getElementById('uptime').textContent = (90 + Math.random() * 10).toFixed(0) + '%';
    }

    document.getElementById('exportBtn').addEventListener('click', () => {
      const cats = Object.keys(data.categories);
      if (!cats.length) { alert('No data to export'); return; }
      let csv = 'Timestamp,Value,Category\n';
      data.timestamps.forEach((t, i) => {
        csv += `${t},${data.values[i]},${cats[i % cats.length]}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `dashboard-${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
    });

    initCharts();
    setInterval(() => {
      const val = Math.floor(Math.random() * 100);
      const cats = ['Traffic', 'Users', 'Errors', 'Requests'];
      updateData(val, cats[Math.floor(Math.random() * cats.length)]);
    }, 2000);
  </script>
</body>
</html>
